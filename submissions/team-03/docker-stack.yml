version: "3.8"

services:
  vault_client:
    image: busybox:1.36
    command: >
      sh -c "test -f /run/secrets/demo_token && echo 'secret-mounted' && tail -f /dev/null"
    deploy:
      replicas: 1  # TODO: aplicar contrato de misión
    secrets:
      - demo_token

secrets:
  demo_token:
    external: true